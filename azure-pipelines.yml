# Anypoint API Manager - declarative instance + policy deployment.
#
# ONE pipeline, config-driven. There is no per-API code: every <api>/apimanager/
# folder in the config repo is a project, and <env>.yaml|json inside it is that
# project's desired state for one environment. Add a folder -> it's deployable on
# the next run. No pipeline edits to onboard an API.
#
# `apiKey` names exactly ONE api folder per run - deploying/extracting "all" at
# once is not supported, by design. It's a dropdown (`values:` below) so you pick a
# real folder instead of typing one; the default is the inert placeholder
# SELECT_ONE, so a run queued without changing it fails fast with a clear error
# rather than silently deploying whatever happened to be first in the list.
# Azure DevOps YAML parameters can't be populated dynamically at queue time, so
# this list is static - regenerate it with pipelines/Update-ApiKeyList.ps1
# whenever an API folder is added to or removed from the config repo (it finds
# and rewrites the marked block inside the apiKey parameter below; don't
# hand-edit that block's entries).
# That static list is also why the `configRepo` trigger below fires the pipeline
# on a merge but cannot itself supply apiKey - until this pipeline adds
# changed-folder detection, treat a merge trigger as a signal to go queue a run
# for the affected api(s), not as a fully automatic deploy.
#
# action = deploy  -> promote through the environment STAGES:
#            Test -> UAT -> PreProd -> Prod
#          PreProd and Prod are gated by approvals (configured on the ADO
#          Environment objects, see below). `targetEnvironment` decides how far
#          the run goes.
# action = extract -> read live policies from the initial env and commit them
#          back to the config repo (initial env only).
#
# Runtime Manager / Mule app deployment is out of scope.

name: apim-$(Build.BuildId)

trigger: none            # this pipeline's own repo does not trigger it
pr: none

parameters:
  - name: action
    displayName: Action
    type: string
    default: deploy
    values: [deploy, extract]

  - name: targetEnvironment
    displayName: Deploy up to (deploy only)
    type: string
    default: test
    values: [test, uat, preprod, prod]

  - name: apiKey
    displayName: API folder name (config repo path, not the Anypoint asset name) - pick one
    type: string
    default: SELECT_ONE
    values:
      # APIKEY_VALUES_START - regenerate with pipelines/Update-ApiKeyList.ps1, do not hand-edit
      - SELECT_ONE
      - orders-api
      # APIKEY_VALUES_END

  - name: dryRun
    displayName: Dry run (plan only, no changes)
    type: boolean
    default: true

  - name: createMode
    displayName: How to create a missing instance
    type: string
    default: auto
    values: [auto, scratch, promote]

  - name: prune
    displayName: Prune override
    type: string
    default: fromconfig
    values: [fromconfig, "true", "false"]

resources:
  repositories:
    # `ref` and `trigger.branches.include` below both name the config repo's branch:
    # `ref` is what a manually queued run checks out, `trigger.branches.include` is what a
    # merge has to land on to auto-trigger a run. They're evaluated before `variables:`
    # exists, so they can't reference variables.configRepoBranch below - they, and it, are
    # the three places this branch name is written; keep all three in sync if you rename it.
    - repository: configRepo
      type: git
      name: mule-config                          # <-- your config repo (prefix "Project/" if it's in a different ADO project)
      ref: refs/heads/main
      trigger:                                    # a merge to the config repo runs this pipeline
        branches:
          include: [main]                         # <-- keep in sync with `ref` above

variables:
  - name: pipelineDir
    value: "$(Build.SourcesDirectory)/pipeline"
  - name: configRepoDir
    value: "$(Build.SourcesDirectory)/config-repo"
  - name: configRepoBranch
    value: main   # <-- keep in sync with resources.repositories.configRepo.ref/trigger above.
                  # Passed explicitly to the Extract stage's git push, instead of an ADO
                  # resource-predefined variable: $(resources.repositories.<alias>.ref) and
                  # the ${{ }} compile-time form both turned out unusable for this (rejected
                  # / not macro-substituted inside an inline script here) when tried against
                  # a real Azure DevOps org - this plain variable is the same $(...) mechanism
                  # already relied on for pipelineDir/configRepoDir above, so it's known-good.
  - name: initialEnv
    value: test                                   # first env in the promotion chain

stages:
  # ---- deploy: promote through environments --------------------------------
  - stage: Test
    displayName: Test
    condition: eq('${{ parameters.action }}', 'deploy')
    jobs:
      - template: pipelines/templates/reconcile-job.yml
        parameters:
          environment: test
          apiKey: ${{ parameters.apiKey }}
          dryRun: ${{ parameters.dryRun }}
          createMode: ${{ parameters.createMode }}
          prune: ${{ parameters.prune }}
          initialEnv: test
          pipelineDir: $(pipelineDir)
          configDir: "$(configRepoDir)"

  - stage: UAT
    displayName: UAT
    dependsOn: Test
    condition: >-
      and(succeeded(), eq('${{ parameters.action }}', 'deploy'),
          in('${{ parameters.targetEnvironment }}', 'uat', 'preprod', 'prod'))
    jobs:
      - template: pipelines/templates/reconcile-job.yml
        parameters:
          environment: uat
          apiKey: ${{ parameters.apiKey }}
          dryRun: ${{ parameters.dryRun }}
          createMode: ${{ parameters.createMode }}
          prune: ${{ parameters.prune }}
          initialEnv: test
          pipelineDir: $(pipelineDir)
          configDir: "$(configRepoDir)"

  # PreProd + Prod: add an "Approvals" check on ADO Environments
  #   anypoint-preprod and anypoint-prod (Pipelines > Environments > ... > Approvals
  #   and checks). The deployment job below binds to those environments.
  - stage: PreProd
    displayName: Pre-Prod (approval)
    dependsOn: UAT
    condition: >-
      and(succeeded(), eq('${{ parameters.action }}', 'deploy'),
          in('${{ parameters.targetEnvironment }}', 'preprod', 'prod'))
    jobs:
      - template: pipelines/templates/reconcile-job.yml
        parameters:
          environment: preprod
          apiKey: ${{ parameters.apiKey }}
          dryRun: ${{ parameters.dryRun }}
          createMode: ${{ parameters.createMode }}
          prune: ${{ parameters.prune }}
          initialEnv: test
          pipelineDir: $(pipelineDir)
          configDir: "$(configRepoDir)"

  - stage: Prod
    displayName: Prod (approval)
    dependsOn: PreProd
    condition: >-
      and(succeeded(), eq('${{ parameters.action }}', 'deploy'),
          eq('${{ parameters.targetEnvironment }}', 'prod'))
    jobs:
      - template: pipelines/templates/reconcile-job.yml
        parameters:
          environment: prod
          apiKey: ${{ parameters.apiKey }}
          dryRun: ${{ parameters.dryRun }}
          createMode: ${{ parameters.createMode }}
          prune: ${{ parameters.prune }}
          initialEnv: test
          pipelineDir: $(pipelineDir)
          configDir: "$(configRepoDir)"

  # ---- extract: live policies -> config repo (initial env only) ------------
  - stage: Extract
    displayName: Extract initial-env policies -> config repo
    condition: eq('${{ parameters.action }}', 'extract')
    jobs:
      - template: pipelines/templates/extract-job.yml
        parameters:
          apiKey: ${{ parameters.apiKey }}
          dryRun: ${{ parameters.dryRun }}
          initialEnv: test
          pipelineDir: $(pipelineDir)
          configRepoDir: $(configRepoDir)
          configDir: "$(configRepoDir)"
          configBranch: $(configRepoBranch)   # see the variables: block above
