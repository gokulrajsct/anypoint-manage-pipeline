# Public/open tier: anyone who wants to use the API, subject to access-control
# requirements (NZ API Standard classification). The most exposed audience, so a missing
# security requirement is build-breaking.
#
# Note: unlike the base rules, this tiering (which classifications fail-hard vs. warn on a
# missing security scheme) is this project's own policy layered on the standard, not a
# clause quoted from it - the published standard describes the four audience categories
# but doesn't publish a per-tier header/security matrix.
extends: ["./nz-api-standard.base.yaml"]
rules:
  nz-security-scheme-required:
    description: "Public API: every operation MUST declare a security requirement (Authorization header, NZ API Standard HTTP Headers)."
    message: "{{path}}: operation has no security requirement declared"
    severity: error
    given: "$.paths[*][get,put,post,delete,patch]"
    then:
      field: security
      function: truthy

  nz-oauth2-scheme-required:
    description: "NZ API Standard, Authentication and Authorisation: where a client must be authorised to use an API, agencies MUST use OAuth 2.1 (OpenID Connect is also acceptable where an OIDC provider is available). Every declared securityScheme on a public API MUST be oauth2 or openIdConnect - a bare apiKey/http scheme alone isn't enough for this tier."
    message: "securityScheme '{{property}}' is type '{{value}}' - public APIs MUST authorise via OAuth 2.1 (oauth2) or openIdConnect"
    severity: error
    given: "$.components.securitySchemes[*]"
    then:
      field: type
      function: enumeration
      functionOptions:
        values: ["oauth2", "openIdConnect"]
