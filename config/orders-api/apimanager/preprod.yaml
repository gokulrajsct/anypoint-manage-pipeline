# Desired state for "orders-api" in PRE-PROD. Missing instance -> promoted from UAT.
apiInstance:
  assetId: orders-api
  groupId: null
  assetVersion: "1.0.3"
  productVersion: v1
  instanceLabel: orders-api-preprod
  deploymentType: cloudhub2
  endpoint:
    implementationUri: https://orders-backend.preprod.svc.example.com:8443/
    type: http
    scheme: https
    port: 8081
    path: /
    withProxy: true
    muleVersion4OrAbove: true

promotion:
  fromEnvironment: uat
  sourceInstanceLabel: orders-api-uat
  copyPolicies: false
  copyTiers: true
  copyAlerts: true

prune: true

policies:
  - assetId: rate-limiting-sla
    groupId: 68ef9520-24e9-4cf2-b2f5-620025690913
    version: "1.4.0"
    order: 1
    configurationData:
      clusterizable: true
      exposeHeaders: true
      rateLimits:
        - maximumRequests: 800
          timePeriodInMilliseconds: 60000

  - assetId: client-id-enforcement
    groupId: 68ef9520-24e9-4cf2-b2f5-620025690913
    version: "1.3.2"
    order: 2
    configurationData:
      credentialsOrigin: customExpression
      clientIdExpression: "#[attributes.headers['client_id']]"
      clientSecretExpression: "#[attributes.headers['client_secret']]"
